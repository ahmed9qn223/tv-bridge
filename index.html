<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>LIVE STREAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .error-msg { color: #ef4444; text-align: center; padding-top: 20%; font-size: 1.2rem; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="player-container"></div>

  <script>
    (function() {
      // 1. ตั้งค่า Domain Lock (ใส่โดเมนของคุณ ถ้าไม่ใส่คือเปิดได้ทุกเว็บ)
      const ALLOWED_DOMAINS = ['ahmed9qn223.github.io', 'localhost', '127.0.0.1'];
      const currentHost = window.location.hostname;
      
      if (ALLOWED_DOMAINS.length > 0 && !ALLOWED_DOMAINS.some(d => currentHost.includes(d))) {
        document.getElementById('player-container').innerHTML = '<div class="error-msg">⛔ ไม่อนุญาตให้ดึงสัญญาณไปใช้ที่โดเมนอื่น</div>';
        return;
      }

      // 2. Base URL เข้ารหัส Base64 ("https://kicksball.com/player/")
      const base64Url = "aHR0cHM6Ly9raWNrc2JhbGwuY29tL3BsYXllci8=";
      
      // 3. แมปชื่อช่อง
      const channels = {
        "gmm25": "gmm25",
        "truefilm1": "true-film-1-418",
        "one31": "one31"
      };

      // 4. ดึงชื่อช่องจาก URL (รองรับทั้ง #gmm25 และ ?ch=gmm25)
      const hashCh = window.location.hash.replace('#', '').trim();
      const urlParams = new URLSearchParams(window.location.search);
      const reqChannel = hashCh || urlParams.get('ch') || 'gmm25';
      
      const targetSlug = channels[reqChannel] || reqChannel;
      const finalUrl = atob(base64Url) + targetSlug;

      // 5. สร้าง Iframe (นำ Sandbox ออกเพื่อทดสอบว่าเว็บต้นทางยอมให้เล่นไหม)
      const iframe = document.createElement('iframe');
      iframe.src = finalUrl;
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
      
      document.getElementById('player-container').appendChild(iframe);

      // โหลดหน้าใหม่เมื่อมีการเปลี่ยน # ช่อง
      window.addEventListener('hashchange', () => location.reload());

      // 6. บล็อก F12 แบบพื้นฐาน
      document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
          e.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
