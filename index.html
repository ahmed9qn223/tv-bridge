<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <!-- ป้องกัน Error 404 favicon.ico ใน Console -->
  <link rel="icon" href="data:,">
  <title>LIVE STREAM PLAYER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #bridge-root { width: 100%; height: 100%; }
    .error-msg {
      color: #ef4444; display: flex; align-items: center; justify-content: center;
      height: 100%; font-size: 1rem; text-align: center; padding: 20px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="bridge-root"></div>

  <script>
    (function() {
      // 1. ตั้งค่า Domain Lock (อนุญาตเฉพาะ GitHub Pages ของคุณ และ localhost)
      const ALLOWED_DOMAINS = ['ahmed9qn223.github.io', 'localhost', '127.0.0.1'];
      const currentHost = window.location.hostname;

      if (ALLOWED_DOMAINS.length > 0 && !ALLOWED_DOMAINS.some(d => currentHost.includes(d))) {
        document.getElementById('bridge-root').innerHTML =
          '<div class="error-msg">⛔ ไม่อนุญาตให้ใช้งานนอกโดเมนที่กำหนด</div>';
        return;
      }

      // 2. กุญแจถอดรหัส XOR (ซ่อนคำว่า kicksball.com ออกจาก Source Code)
      const SECRET_KEY = "DONOK_STREAM_KEY_2026";
      const ENCRYPTED_BASE = "LA8aGFFeX19dCwocHxcPGUxNCh9cNF4JBRwfHhs="; // "https://kicksball.com/player/"

      function xorDecode(encodedB64, key) {
        try {
          const raw = atob(encodedB64);
          let out = '';
          for (let i = 0; i < raw.length; i++) {
            out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
          }
          return out;
        } catch {
          return '';
        }
      }

      // 3. รายชื่อช่องลัด (สามารถพิมพ์ #ชื่อช่องอะไรก็ได้ของเว็บต้นทางต่อท้าย URL ได้ทันที)
      const CHANNEL_MAP = {
        "gmm25": "gmm25",
        "truefilm1": "true-film-1-418",
        "one31": "one31",
        "ch3": "ch3",
        "ch7": "ch7",
        "pptv": "pptv",
        "amarin": "amarin",
        "thairath": "thairath",
        "workpoint": "workpoint",
        "mono29": "mono29",
        "true4u": "true4u"
      };

      const hashCh = window.location.hash.replace('#', '').trim();
      const urlParams = new URLSearchParams(window.location.search);
      const reqChannel = hashCh || urlParams.get('ch') || 'gmm25';

      const targetSlug = CHANNEL_MAP[reqChannel.toLowerCase()] || reqChannel;
      const finalUrl = xorDecode(ENCRYPTED_BASE, SECRET_KEY) + targetSlug;

      // 4. สร้าง Iframe ภายใน Closed Shadow DOM (ซ่อนจากหน้า Elements ปกติ + บล็อกโฆษณาเด้งด้วย sandbox)
      const hostEl = document.getElementById('bridge-root');
      const shadow = hostEl.attachShadow({ mode: 'closed' });

      const iframe = document.createElement('iframe');
      iframe.src = finalUrl;
      iframe.style.cssText = 'width:100%; height:100%; border:none; display:block;';
      iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
      // บล็อกโฆษณาเด้งหน้าต่างใหม่ (ไม่มี allow-popups และ allow-top-navigation)
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');

      shadow.appendChild(iframe);

      // รีโหลดอัตโนมัติเมื่อเปลี่ยน #ชื่อช่อง บน URL
      window.addEventListener('hashchange', () => location.reload());

      // 5. บล็อกปุ่มคีย์ลัดดู Source Code พื้นฐาน (ไม่ใช้ debugger เพื่อไม่ให้หน้าเว็บค้าง)
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
          (e.ctrlKey && ['U', 'S', 'u', 's'].includes(e.key))
        ) {
          e.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
