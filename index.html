<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>LIVE STREAM PLAYER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #bridge-root { width: 100%; height: 100%; }
    .error-msg {
      color: #ef4444; display: flex; align-items: center; justify-content: center;
      height: 100%; font-size: 1rem; text-align: center; padding: 20px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="bridge-root"></div>

  <script>
    (function() {
      // 1. Domain Lock ป้องกันคนอื่นขโมยลิงก์ไปใช้
      const ALLOWED_DOMAINS = ['ahmed9qn223.github.io', 'localhost', '127.0.0.1'];
      const currentHost = window.location.hostname;

      if (ALLOWED_DOMAINS.length > 0 && !ALLOWED_DOMAINS.some(d => currentHost.includes(d))) {
        document.getElementById('bridge-root').innerHTML =
          '<div class="error-msg">⛔ ไม่อนุญาตให้ใช้งานนอกโดเมนที่กำหนด</div>';
        return;
      }

      // 2. ถอดรหัส Base URL (ฐานลิงก์ต้นทาง)
      const base64Url = "aHR0cHM6Ly9raWNrc2JhbGwuY29tL3BsYXllci8=";
      const baseUrl = atob(base64Url);

      // 3. รายชื่อช่องสำหรับแปลงรหัสย่อ
      const CHANNEL_MAP = {
        "gmm25": "gmm25",
        "truefilm1": "true-film-1-418",
        "one31": "one31",
        "ch3": "ch3",
        "ch7": "ch7",
        "pptv": "pptv"
      };

      // 4. ดึงค่าช่องจากแฮช
      let reqChannel = "gmm25"; // ช่องเริ่มต้น
      const hashVal = window.location.hash.trim();
      if (hashVal.length > 1) {
        reqChannel = hashVal.substring(1).toLowerCase();
      } else {
        const params = new URLSearchParams(window.location.search);
        if (params.has('ch')) {
          reqChannel = params.get('ch').toLowerCase();
        }
      }

      // ปรับปรุง: Fallback กลับไปช่องเริ่มต้น (gmm25) เสมอหากพิมพ์ชื่อช่องผิด เพื่อป้องกันหน้าจอ 404 Not Found
      const targetSlug = CHANNEL_MAP[reqChannel] || CHANNEL_MAP["gmm25"];
      const finalUrl = baseUrl + targetSlug;

      // 5. สร้าง Iframe แสดงผลวิดีโอ
      const hostEl = document.getElementById('bridge-root');
      const shadow = hostEl.attachShadow({ mode: 'closed' });

      const iframe = document.createElement('iframe');
      iframe.src = finalUrl;
      iframe.style.cssText = 'width:100%; height:100%; border:none; display:block;';
      iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
      
      // ปรับปรุง: นำ sandbox attribute ออกเพื่อไม่ให้บล็อก WebSocket/P2P และสคริปต์ของ JW Player ฝั่งต้นทาง
      
      shadow.appendChild(iframe);

      // อัปเดตอัตโนมัติเมื่อกดเปลี่ยนช่อง (#hash) บน URL
      window.addEventListener('hashchange', () => location.reload());

      // บล็อกปุ่มลัด F12 / Ctrl+U
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
          (e.ctrlKey && ['U', 'S', 'u', 's'].includes(e.key))
        ) {
          e.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
