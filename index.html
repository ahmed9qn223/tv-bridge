<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Secure Stream Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #mount-node { width: 100%; height: 100%; position: relative; }
    .status-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #050811; color: #94a3b8;
      font-size: 14px; text-align: center; padding: 20px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="mount-node">
    <div class="status-screen" id="loader">
      <div class="spinner"></div>
      <div>กำลังเข้ารหัสสัญญาณภาพ...</div>
    </div>
  </div>

  <script>
    (function() {
      // =======================================================================
      // 1. ตั้งค่าความปลอดภัยและกุญแจเข้ารหัส (แก้ไขได้ตามต้องการ)
      // =======================================================================
      const SECRET_KEY = "DONOK_STREAM_KEY_2026";

      // รายชื่อโดเมนที่อนุญาตให้เปิดหน้าเว็บนี้ได้ (ถ้าว่างไว้ [] คือเปิดได้ทุกโดเมน)
      // เช่น ['shchenyu.github.io', '127.0.0.1', 'localhost']
      const ALLOWED_DOMAINS = [];

      // ฟังก์ชันเข้ารหัส/ถอดรหัส XOR + Base64
      function xorDecode(encodedB64, key) {
        try {
          const raw = atob(encodedB64);
          let out = '';
          for (let i = 0; i < raw.length; i++) {
            out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
          }
          return out;
        } catch {
          return '';
        }
      }

      // Base URL ที่ถูกเข้ารหัสด้วย XOR + SECRET_KEY ("https://kicksball.com/player/")
      // ป้องกันการค้นหาคำว่า kicksball ใน Source Code
      const ENCRYPTED_BASE = "LA8aGFFeX19dCwocHxcPGUxNCh9cNF4JBRwfHhs=";

      // รายชื่อช่องที่อนุญาต (เรียกผ่าน URL เช่น index.html#gmm25 หรือ index.html?ch=gmm25)
      const CHANNEL_MAP = {
        "gmm25": "gmm25",
        "truefilm1": "true-film-1-418",
        "one31": "one31",
        "ch3": "ch3",
        "ch7": "ch7",
        "PPTV": "pptv"
      };

      // =======================================================================
      // 2. ตรวจสอบสิทธิ์โดเมน (Domain Lock)
      // =======================================================================
      const currentHost = window.location.hostname;
      if (ALLOWED_DOMAINS.length > 0 && !ALLOWED_DOMAINS.some(d => currentHost.includes(d))) {
        document.getElementById('mount-node').innerHTML =
          '<div class="status-screen">⛔ ไม่อนุญาตให้ใช้งานนอกโดเมนที่กำหนด</div>';
        return;
      }

      // =======================================================================
      // 3. ดึงชื่อช่องจาก URL (#gmm25 หรือ ?ch=gmm25) ค่าเริ่มต้นคือ gmm25
      // =======================================================================
      const urlParams = new URLSearchParams(window.location.search);
      const hashCh = window.location.hash.replace('#', '').trim();
      const reqChannel = urlParams.get('ch') || hashCh || 'gmm25';
      const targetSlug = CHANNEL_MAP[reqChannel] || reqChannel;

      // ถอดรหัสลิงก์จริงในหน่วยความจำ
      const baseUrl = xorDecode(ENCRYPTED_BASE, SECRET_KEY);
      const finalTargetUrl = baseUrl + targetSlug;

      // =======================================================================
      // 4. สร้าง Closed Shadow DOM + Nested Blob Iframe + Ad-Blocker Sandbox
      // =======================================================================
      let shadowRootRef = null;
      let currentBlobUrl = null;

      function mountProtectedPlayer() {
        const hostEl = document.getElementById('mount-node');
        hostEl.innerHTML = ''; // ลบหน้าโหลดทิ้ง

        // ใช้ Closed Shadow DOM เพื่อซ่อนโครงสร้างภายในจาก document.querySelector
        shadowRootRef = hostEl.attachShadow({ mode: 'closed' });

        // สร้าง HTML จำลองใน Blob เพื่อซ่อน URL ชั้นแรก และใส่ sandbox บล็อกโฆษณาเด้ง
        const innerHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
              iframe { width:100%; height:100%; border:0; display:block; }
            </style>
          </head>
          <body oncontextmenu="return false;">
            <iframe
              src="${finalTargetUrl}"
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              allowfullscreen
              sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
            ></iframe>
          </body>
          </html>
        `;

        const blob = new Blob([innerHtml], { type: 'text/html' });
        currentBlobUrl = URL.createObjectURL(blob);

        const outerIframe = document.createElement('iframe');
        outerIframe.src = currentBlobUrl;
        outerIframe.style.cssText = 'width:100%; height:100%; border:none; display:block;';
        outerIframe.setAttribute('allowfullscreen', 'true');
        outerIframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');

        shadowRootRef.appendChild(outerIframe);

        // ล้างค่า Blob URL ออกจากหน่วยความจำหลังจากโหลดเสร็จ 3 วินาที
        outerIframe.onload = function() {
          setTimeout(() => {
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          }, 3000);
        };
      }

      window.addEventListener('DOMContentLoaded', mountProtectedPlayer);

      // รองรับการเปลี่ยนช่องแบบไม่ต้องรีเฟรชหน้า เมื่อเปลี่ยน #hash บน URL
      window.addEventListener('hashchange', () => location.reload());

      // =======================================================================
      // 5. ระบบป้องกันการเปิด DevTools (Anti-Inspect & Auto-Wipe)
      // =======================================================================
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
          (e.ctrlKey && ['U', 'S', 'u', 's'].includes(e.key))
        ) {
          e.preventDefault();
          return false;
        }
      });

      // ตรวจจับการเปิด DevTools ค้างไว้ และสั่งทำลายหน้าจอเล่นวิดีโอทันที
      function destroyPlayerOnInspect() {
        const hostEl = document.getElementById('mount-node');
        if (hostEl) {
          hostEl.innerHTML = '<div class="status-screen">🛡️ ตรวจพบเครื่องมือตรวจสอบโค้ด ระบบได้ตัดสัญญาณเพื่อความปลอดภัย</div>';
        }
      }

      setInterval(() => {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        if (widthThreshold || heightThreshold) {
          destroyPlayerOnInspect();
        }
        const t0 = performance.now();
        debugger;
        const t1 = performance.now();
        if (t1 - t0 > 100) {
          destroyPlayerOnInspect();
        }
      }, 1500);

    })();
  </script>
</body>
</html>
